name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  integration-tests:
    name: Integration Tests (RLS, constraints, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: cinema_platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Create app role (mirrors Supabase's non-superuser runtime role)
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          psql -h localhost -U postgres -c "CREATE USER app WITH PASSWORD 'app_ci_password' CREATEDB;"

      - name: Apply local auth shim (reproduces Supabase's auth.uid()/auth.jwt())
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          psql -h localhost -U postgres -d cinema_platform_ci \
            -f tests/integration/fixtures/local-auth-shim.sql

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@localhost:5432/cinema_platform_ci
        run: npm run db:migrate

      - name: Apply local auth grants (post-migration, once roles exist)
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          psql -h localhost -U postgres -d cinema_platform_ci \
            -f tests/integration/fixtures/local-auth-grants.sql

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres_ci_password@localhost:5432/cinema_platform_ci
          APP_DATABASE_URL: postgres://app:app_ci_password@localhost:5432/cinema_platform_ci
        run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          # Build-time placeholders — real values are injected by Vercel at
          # deploy time. Present here only so `next build` doesn't fail on
          # missing env vars for statically-analyzed routes.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
